approved_by: "Pending SME review"  # still a work in progress -- not yet signed off by the client

# ---------------------------------------------------------------------------
# Built directly from the client "Meta Data Request.xlsx" — their most-used file
# types and requested metadata. Scope for this pass: adopt the client's stated
# document types and metadata set as-is.
#
# Document types present in the sample project but NOT on the client's list route
# to "Other" for now (Marketing Flyer, Proposal/Pitch Deck, Correspondence, Permit,
# Entity/Governance, Market Report, Listing Agreement, Title Commitment/Policy).
# Flagged for SME review — do not silently drop; confirm before adding back.
#
# Metadata is ONE consistent set applied across all types, grouped by how each field
# is populated:
#   folder   = parsed from the SharePoint folder path (deterministic; no AI, no threshold)
#   system   = SharePoint / library native (no extraction)
#   content  = extracted from document text by the AI pipeline (Agent 2; has thresholds)
#
# NOTE (pipeline impact): this replaces v3's `common_categories` with the provenance-
# grouped `metadata` block. TaxonomyLoader / MetadataSchemaBuilder must be updated to
# read `metadata.content.*` and `confidence_thresholds.agent2_content`.
# ---------------------------------------------------------------------------

document_types:

  # --- Contracts (source files PDF; drafts are in Word) ---
  - label: "PSA - Acquisition"
    group: "Contracts"
    description: "Purchase & sale agreement where the client is acquiring the property"
  - label: "PSA - Disposition"
    group: "Contracts"
    description: "Purchase & sale agreement where the client is disposing of the property"
  - label: "Lease"
    group: "Contracts"
    description: "Lease agreement"
  - label: "Lease Amendment"
    group: "Contracts"
    description: "Amendment or modification to an existing lease"
  - label: "Vendor Contract"
    group: "Contracts"
    description: "Service/vendor agreement (GC, civil, architectural, engineering, etc.)"
  - label: "Commission Agreement"
    group: "Contracts"
    description: "Broker commission agreement"
  - label: "Loan Agreement"
    group: "Contracts"
    description: "Executed loan or financing agreement"
  - label: "JV Agreement"
    group: "Contracts"
    description: "Joint venture agreement"
  - label: "Development Agreement"
    group: "Contracts"
    description: "Development services / development management agreement"
  - label: "Letter of Intent"
    group: "Contracts"
    description: "LOI for lease or purchase"
  - label: "Term Sheet"
    group: "Contracts"
    description: "Financing or deal term sheet (typically a proposal, not executed)"

  # --- Drawing Files (PDF; some CAD) ---
  # IMPORTANT — evaluate these three in order: Plat, then Survey, then Design Drawing.
  # Plats and surveys are also drawn by engineering/surveying firms, so "prepared by an A/E firm"
  # does NOT by itself mean Design Drawing. Match on the legal/title markers first.
  - label: "Plat"
    group: "Drawing Files"
    description: "A subdivision plat or replat recorded (or to be recorded) with the county. A legal instrument that establishes lots, blocks, and dedications — not a construction drawing."
    decision_rules:
      - "CHECK FIRST: if the sheet's own title is PLAT, REPLAT, FINAL PLAT, AMENDING PLAT or similar, classify as Plat"
      - "An owner's dedication statement ('...do hereby dedicate...') together with a city/county approval-and-signature block indicates a Plat"
      - "A Plat CREATES lots and dedications; a Survey DEPICTS boundaries that already exist"
      - "Citing recorded instruments (INST. NO., CAB./SL., VOL./PG.) does NOT by itself make a sheet a Plat — surveys routinely reference recorded easements and adjoining plats. Require the sheet's own title or a dedication/approval block"
      - "Being drawn by an engineering or surveying firm does NOT make it a Design Drawing — plats are drawn by surveyors"
  - label: "Survey"
    group: "Drawing Files"
    description: "A boundary, ALTA/NSPS, or topographic survey prepared by a licensed surveyor to establish legal boundaries for title or closing purposes — not a construction drawing."
    decision_rules:
      - "CHECK SECOND: an RPLS seal, 'Registered Professional Land Surveyor', or a surveyor's certification indicates a Survey"
      - "The words ALTA, NSPS, 'LAND TITLE SURVEY', 'BOUNDARY SURVEY', or 'TOPOGRAPHIC SURVEY' indicate a Survey"
      - "A title-company or commitment reference (e.g. 'Chicago Title', 'GF No.', 'Schedule B') indicates a Survey"
      - "A survey that cites recorded plats or instrument numbers is still a Survey, NOT a Plat"
      - "Being drawn by an engineering or surveying firm does NOT make it a Design Drawing — surveys are drawn by surveyors"
  - label: "Design Drawing"
    group: "Drawing Files"
    description: "Architectural, civil, structural, or MEP construction drawing — site plans, floor plans, elevations, sections, details, general notes, grading plans, permit sets. A drawing produced by an A/E firm is a Design Drawing regardless of how much text it contains."
    decision_rules:
      - "CHECK LAST: use Design Drawing only when the Plat and Survey markers above are absent"
      - "Site plans, floor plans, permit sets, grading plans, elevations, details, general notes = Design Drawing"
      - "A drawing produced by an architect or engineer is a Design Drawing — unless it is a recorded Plat or a surveyor-sealed Survey, which take precedence"
    # Classification (and vision correction) still run; Agent 2 metadata extraction is skipped as
    # low-value cost for this type.
    extraction_enabled: false

  # --- Reports (PDF) ---
  - label: "Closing Statement"
    group: "Reports"
    description: "Settlement statement, HUD-1, or closing statement"
  - label: "Environmental Survey"
    group: "Reports"
    description: "Phase I/II ESA and other environmental reports"
  - label: "Geotechnical Report"
    group: "Reports"
    description: "Geotechnical engineering report — pre-construction subsurface investigation (soil borings, soil classification, bearing capacity, foundation recommendations). Not materials testing performed during construction (see CMT)."
    decision_rules:
      - "CHECK FIRST: if the report performs a soil boring/subsurface investigation and recommends a foundation type or bearing capacity, it is a Geotechnical Report."
      - "If instead the report presents test results (e.g. concrete cylinder breaks, compaction/density tests) on samples taken during construction, it is CMT, not a Geotechnical Report."
  - label: "CMT"
    group: "Reports"
    description: "Construction Materials Testing report — concrete cylinder breaks, compaction/density tests, rebar/steel inspection, and similar in-construction materials testing performed by a third-party testing lab. Not the pre-construction subsurface investigation (see Geotechnical Report)."
    decision_rules:
      - "CHECK FIRST: if the report presents test results (e.g. concrete cylinder breaks, compaction/density tests, rebar inspection) on samples or work taken/inspected during construction, it is CMT."
      - "If instead the report is a pre-construction soil boring/subsurface investigation recommending a foundation type or bearing capacity, it is a Geotechnical Report, not CMT."
  - label: "Easement Document"
    group: "Reports"
    description: "Easement, encroachment, or related recorded document"

  # --- Budget Files (Excel) ---
  - label: "Proforma"
    group: "Budget Files"
    description: "Development pro forma / financial model"
  - label: "Budget / Cost Estimate"
    group: "Budget Files"
    description: "Development budget or cost estimate"
  - label: "Bid Tab"
    group: "Budget Files"
    description: "Bid tabulation / GC bid comparison"
  - label: "Draw Request"
    group: "Budget Files"
    description: "Construction loan draw request"
  - label: "Operating Budget"
    group: "Budget Files"
    description: "Annual operating budget"

  - label: "Other"
    group: "Other"
    description: "Does not fit a client-listed type (incl. marketing, correspondence, permits, entity docs, market reports) — pending SME review"

# ---------------------------------------------------------------------------
# METADATA — one consistent set applied across all document types.
# ---------------------------------------------------------------------------
metadata:

  # Folder-derived: parsed once from the project folder "{State} {Metro} {Project}".
  # Set as SharePoint folder default column values; no AI, no confidence threshold.
  folder_derived:
    - field_name: state
      sharepoint_column: "State"
      description: "US state (from folder prefix, e.g., TX, OK)"
    - field_name: propertyName
      sharepoint_column: "PropertyName"
      description: "Property name (from folder project segment, e.g., Risinger)"
    - field_name: projectName
      sharepoint_column: "ProjectName"
      description: "Project / development name (from folder; may equal Property Name)"

  # System / native: provided by SharePoint or the file itself — not AI-extracted.
  system:
    - field_name: documentTitle
      sharepoint_column: "Title"
      description: "Document title (file name)"
    - field_name: author
      sharepoint_column: "Author"
      description: "Author (from library metadata)"
    - field_name: lastModified
      sharepoint_column: "Modified"
      description: "Last modified date (from library metadata)"
    - field_name: sourceSystem
      sharepoint_column: "SourceSystem"
      description: "Originating system / library (operational tag)"

  # Content-extracted: pulled from document text by the AI pipeline (Agent 2).
  content:

    # Universal — reliably present on most documents.
    universal:
      - field_name: documentStatus
        sharepoint_column: "DocumentStatus"
        description: "Lifecycle status of the document"
        allowed_values: ["Draft", "Executed", "Final", "Superseded"]
        decision_rules:
          - "Signed/executed agreements (incl. DocuSign) are 'Executed'"
          - "Recorded instruments are 'Final'"
          - "Marked drafts/redlines are 'Draft'"
      - field_name: counterparty
        sharepoint_column: "Counterparty"
        description: "External company or entity opposite the client (broker, lender, buyer/seller, vendor)"
        is_freetext: true
      - field_name: transactionType
        sharepoint_column: "TransactionType"
        description: "Type of transaction the document relates to"
        allowed_values:
          - "Acquisition"
          - "Disposition"
          - "Lease"
          - "Easement"
          - "Development Agreement"
          - "Loan"
          - "Construction Contract"
        decision_rules:
          - "Use the numbered project subfolder as a prior (03-Acq→Acquisition, 06-Dispo→Disposition, 04-Des & Const→Construction Contract); override only if document content clearly disagrees"

    # Property — populate mainly from title, survey, plat, ESA; sparse on other types.
    property:
      - field_name: propertyAddress
        sharepoint_column: "PropertyAddress"
        description: "Street address of the property"
        is_freetext: true
      - field_name: parcelId
        sharepoint_column: "ParcelID"
        description: "Tax parcel / account ID"
        is_freetext: true
      - field_name: county
        sharepoint_column: "County"
        description: "County the property is located in"
        is_freetext: true
      - field_name: cityJurisdiction
        sharepoint_column: "CityJurisdiction"
        description: "City or ETJ jurisdiction"
        is_freetext: true
      - field_name: acres
        sharepoint_column: "Acres"
        value_type: number
        description: "Land acreage"
      - field_name: squareFootage
        sharepoint_column: "SquareFootage"
        value_type: number
        description: "Building square footage"
      - field_name: landUse
        sharepoint_column: "LandUse"
        description: "Land use type"
        is_freetext: true
      - field_name: zoning
        sharepoint_column: "Zoning"
        description: "Zoning classification"
        is_freetext: true
      - field_name: opportunityZone
        sharepoint_column: "OpportunityZone"
        description: "Whether the property is in an Opportunity Zone"
        allowed_values: ["Yes", "No", "Unknown"]

    # Transaction — populate on transaction docs (PSA, lease, loan, closing); sparse elsewhere.
    transaction:
      - field_name: executionDate
        sharepoint_column: "ExecutionDate"
        value_type: dateTime
        description: "Date the document was executed/signed"
      - field_name: effectiveDate
        sharepoint_column: "EffectiveDate"
        value_type: dateTime
        description: "Effective date"
      - field_name: expirationDate
        sharepoint_column: "ExpirationDate"
        value_type: dateTime
        description: "Expiration date (if applicable)"
      - field_name: seller
        sharepoint_column: "Seller"
        description: "Seller / grantor entity"
        is_freetext: true
      - field_name: buyer
        sharepoint_column: "Buyer"
        description: "Buyer / grantee entity"
        is_freetext: true
      - field_name: broker
        sharepoint_column: "Broker"
        description: "Broker involved in the transaction"
        is_freetext: true
      - field_name: titleCompany
        sharepoint_column: "TitleCompany"
        description: "Title company / escrow agent"
        is_freetext: true
      - field_name: closingDate
        sharepoint_column: "ClosingDate"
        value_type: dateTime
        description: "Closing date"
      - field_name: purchasePrice
        sharepoint_column: "PurchasePrice"
        description: "Purchase / sale price"
      - field_name: earnestMoney
        sharepoint_column: "EarnestMoney"
        description: "Earnest money deposit"
      - field_name: depositAmount
        sharepoint_column: "DepositAmount"
        description: "Deposit amount"
      - field_name: contractValue
        sharepoint_column: "ContractValue"
        description: "Total contract value"

    # Ownership — from the CoPilot-suggested Layer 1 list (validate at SME review).
    ownership:
      - field_name: entityName
        sharepoint_column: "EntityName"
        description: "Legal entity named in the document (e.g., IDV Risinger, LLC)"
        is_freetext: true
      - field_name: investorFund
        sharepoint_column: "InvestorFund"
        description: "Investor or fund party (if applicable)"
        is_freetext: true

confidence_thresholds:
  agent1_classification: 0.80
  agent2_content:
    documentStatus: 0.75
    counterparty: 0.70
    transactionType: 0.75
    opportunityZone: 0.50
    default: 0.75

# ---------------------------------------------------------------------------
# CHANGES FROM v3 (for reviewers)
# ---------------------------------------------------------------------------
# + Document types now match the client's Meta Data Request groups (Contracts,
#   Drawing Files, Reports, Budget Files) — contracts split to their granularity
#   (PSA Acq/Dispo, Lease, Lease Amendment, JV, Development, Vendor, Commission,
#   Term Sheet all separate); Design Drawing added with a discipline sub-field;
#   Bid Tab and Draw Request added.
# + Single consistent metadata set (universal/property/transaction/ownership),
#   replacing per-type field lists.
# + Fields grouped by provenance (folder / system / content).
# - Submarket removed  → replaced by folder-derived State + content County/City.
# - Confidentiality removed → not requested by the client, and it was the primary
#   review-queue driver (unreliable AI guess). Handle sensitivity via Purview labels.
# ~ Transaction Type replaces DealType with the client's 7 values (adds Easement,
#   Construction Contract; Acquisition/Disposition instead of generic "Sale").
